name: Update KSC Field Mill Placefile

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/update-fieldmills.yml"
  schedule:
    # GitHub scheduled workflows have a practical minimum of 5 minutes.
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * * * *"

permissions:
  contents: write

concurrency:
  group: ksc-fieldmill-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependency
        run: pip install -r requirements.txt

      - name: Test API parser
        run: python -m unittest discover -s tests

      - name: Generate placefile
        run: python src/ksc_fieldmill_placefile.py

      - name: Commit updated output
        run: |
          git config user.name "ksc-fieldmill-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/ksc_fieldmills.txt docs/ksc_fieldmills.json docs/efm_status_icons.png
          if git diff --cached --quiet; then
            echo "No placefile change"
          else
            git commit -m "Update KSC field mill observations"
            for attempt in 1 2 3; do
              if git pull --rebase origin main && git push origin HEAD:main; then
                exit 0
              fi
              git rebase --abort || true
              sleep 5
            done
            exit 1
          fi
